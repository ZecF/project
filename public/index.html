<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrafficGuard Pro - Web & DB</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #050505; color: #00ff66; font-family: monospace; display: flex; height: 100vh; overflow: hidden; }
        sidebar { width: 380px; background: #0c0c0c; border-right: 1px solid #222; padding: 25px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        main { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; padding: 20px; }
        h2 { font-size: 16px; letter-spacing: 2px; color: #fff; }
        .card { background: #121212; border: 1px solid #222; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .metric { font-size: 26px; color: #00ff66; font-weight: bold; }
        .label { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        .action-btn { background: #1a1a1a; color: #00ffff; border: 1px solid #00ffff; padding: 12px; cursor: pointer; font-family: monospace; font-weight: bold; text-transform: uppercase; transition: all 0.3s ease; }
        .action-btn:hover, .action-btn.active { background: #00ffff; color: #000; }
        .log-container { font-size: 13px; color: #00ffff; background: #000; padding: 10px; border: 1px solid #333; height: 120px; overflow-y: auto; white-space: pre-wrap; }
        .video-container { position: relative; display: inline-block; }
        video, canvas { display: block; max-width: 100%; border: 1px solid #222; box-shadow: 0 0 40px rgba(0,0,0,0.9); }
        canvas { position: absolute; top: 0; left: 0; }
        .status-dot { height: 10px; width: 10px; background-color: #ffeb3b; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #ffeb3b; }
        .db-status { font-size: 11px; color: #aaa; margin-top: -5px; }
    </style>
</head>
<body>

    <sidebar>
        <h2>TRAFFIC_GUARD <span class="status-dot" id="dot"></span></h2>
        
        <button id="btnColor" class="action-btn">Scan RGB / Grayscale</button>

        <div class="card">
            <span class="label">Detected Vehicles</span>
            <span class="metric" id="vehicles">0</span>
        </div>

        <div class="card">
            <span class="label">Color Array Log</span>
            <div id="colorLogs" class="log-container">Awaiting Scan...</div>
        </div>

        <div class="card">
            <span class="label">Latest ANPR Plate</span>
            <span class="metric" id="plate" style="font-size: 18px; color: #ffeb3b;">SCANNING...</span>
            <span class="db-status" id="dbStatus">Database: Standby</span>
        </div>
    </sidebar>

    <main>
        <div class="video-container">
            <video id="webcam" autoplay playsinline width="640" height="480"></video>
            <canvas id="canvas" width="640" height="480"></canvas>
            <canvas id="cropCanvas" style="display:none;"></canvas>
            <canvas id="colorCanvas" style="display:none;"></canvas>
        </div>
    </main>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cropCanvas = document.getElementById('cropCanvas');
        const cropCtx = cropCanvas.getContext('2d');
        const colorCanvas = document.getElementById('colorCanvas');
        const colorCtx = colorCanvas.getContext('2d');

        let model = null, ocrWorker = null, isProcessingOCR = false;
        let lastPlate = "WAITING...";
        let lastSavedPlate = ""; // Mencegah spam save ke DB
        let detectColorEnabled = false;

        document.getElementById('btnColor').addEventListener('click', function() {
            detectColorEnabled = !detectColorEnabled;
            this.classList.toggle('active');
            document.getElementById('colorLogs').innerText = detectColorEnabled ? "Scanning colors...\n" : "Color Scanner OFF.";
        });

        const colorDatabase = [
            { name: 'Hitam', r: 30, g: 30, b: 30, type: 'Grayscale' },
            { name: 'Putih', r: 220, g: 220, b: 220, type: 'Grayscale' },
            { name: 'Abu', r: 128, g: 128, b: 128, type: 'Grayscale' },
            { name: 'Merah', r: 220, g: 30, b: 30, type: 'RGB' },
            { name: 'Biru', r: 30, g: 30, b: 220, type: 'RGB' },
            { name: 'Hijau', r: 30, g: 220, b: 30, type: 'RGB' },
            { name: 'Kuning', r: 220, g: 220, b: 30, type: 'RGB' }
        ];

        function getClosestColor(r, g, b) {
            let isMonochrome = Math.abs(r-g) < 25 && Math.abs(g-b) < 25 && Math.abs(r-b) < 25;
            let minDistance = Infinity, closest = colorDatabase[0];
            for (let color of colorDatabase) {
                let dist = Math.sqrt(Math.pow(r - color.r, 2) + Math.pow(g - color.g, 2) + Math.pow(b - color.b, 2));
                if (isMonochrome && color.type !== 'Grayscale') dist += 80; 
                if (dist < minDistance) { minDistance = dist; closest = color; }
            }
            return closest.name;
        }

        function extractTopColors(imageData) {
            let colorCounts = {}, data = imageData.data, totalSampled = 0;
            for (let i = 0; i < data.length; i += 16) {
                let colorName = getClosestColor(data[i], data[i+1], data[i+2]);
                colorCounts[colorName] = (colorCounts[colorName] || 0) + 1;
                totalSampled++;
            }
            let sorted = Object.entries(colorCounts).sort((a, b) => b[1] - a[1]);
            let finalColors = [];
            for (let [name, count] of sorted) {
                if ((count / totalSampled) > 0.10) finalColors.push(name);
                if (finalColors.length >= 3) break;
            }
            return finalColors.length > 0 ? finalColors : [sorted[0][0]];
        }

        // Fungsi HTTP Request ke Node.js Backend
        async function saveToMongoDB(vehicleId, colors, plate) {
            try {
                document.getElementById('dbStatus').innerText = "Saving to DB...";
                const response = await fetch('/api/save-log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vehicleId: vehicleId, colors: colors, plateNumber: plate })
                });
                
                if(response.ok) {
                    document.getElementById('dbStatus').innerText = "Database: Saved ✓";
                    document.getElementById('dbStatus').style.color = "#00ff66";
                }
            } catch (err) {
                document.getElementById('dbStatus').innerText = "Database: Error ✗";
                document.getElementById('dbStatus').style.color = "red";
            }
        }

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 640, height: 480 }, audio: false });
                video.srcObject = stream;
                return new Promise(resolve => { video.onloadedmetadata = () => resolve(video); });
            } catch (err) {
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = fallback;
                return new Promise(resolve => { video.onloadedmetadata = () => resolve(video); });
            }
        }

        async function runDetection() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const predictions = await model.detect(video);
            
            let vehicleCount = 0;
            let targetVehicle = null;
            let targetColors = [];
            let targetId = 0;
            let colorLogText = "";

            predictions.forEach((prediction) => {
                const [x, y, width, height] = prediction.bbox;
                const label = prediction.class;

                if (['car', 'bus', 'truck', 'motorcycle'].includes(label)) {
                    vehicleCount++;
                    let vehicleId = vehicleCount;

                    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.strokeRect(x, y, width, height);
                    let displayColors = [];
                    
                    if (detectColorEnabled && width > 50 && height > 50) {
                        const cx = x + (width * 0.15), cy = y + (height * 0.15), cw = width * 0.7, ch = height * 0.7;
                        colorCanvas.width = cw; colorCanvas.height = ch;
                        colorCtx.drawImage(video, cx, cy, cw, ch, 0, 0, cw, ch);
                        
                        try {
                            displayColors = extractTopColors(colorCtx.getImageData(0, 0, cw, ch));
                            colorLogText += `${vehicleId} [${displayColors.join(', ')}]\n`;

                            ctx.fillStyle = '#111'; ctx.fillRect(x, y - 20, 150, 18);
                            ctx.fillStyle = '#00ffff'; ctx.font = '12px monospace';
                            ctx.fillText(`ID:${vehicleId} [${displayColors.join(', ')}]`, x + 5, y - 6);
                        } catch (e) {}
                    } else {
                        ctx.fillStyle = '#00ffff'; ctx.font = '12px monospace';
                        ctx.fillText(`${label.toUpperCase()}`, x, y > 12 ? y - 4 : 12);
                    }

                    // Tentukan kendaraan yang akan diproses OCR (yang paling besar di layar)
                    if (!targetVehicle && width > 100 && height > 60) {
                        targetVehicle = { x, y, width, height };
                        targetColors = displayColors;
                        targetId = vehicleId;
                    }
                }
            });

            document.getElementById('vehicles').innerText = vehicleCount;
            if (detectColorEnabled) {
                document.getElementById('colorLogs').innerText = vehicleCount > 0 ? colorLogText : "No vehicles detected.";
            }

            // Jalankan OCR dengan membawa data ID dan Warna untuk dikirim ke DB
            if (targetVehicle && !isProcessingOCR && ocrWorker) {
                isProcessingOCR = true;
                processANPR(targetVehicle, targetId, targetColors);
            }

            requestAnimationFrame(runDetection);
        }

        async function processANPR(box, id, colors) {
            try {
                cropCanvas.width = box.width; cropCanvas.height = box.height;
                cropCtx.drawImage(video, box.x, box.y, box.width, box.height, 0, 0, box.width, box.height);
                
                const { data: { text } } = await ocrWorker.recognize(cropCanvas.toDataURL('image/png'));
                const cleaned = text.replace(/[^A-Z0-9]/g, '').trim();
                
                if (cleaned.length >= 4) {
                    lastPlate = cleaned;
                    document.getElementById('plate').innerText = lastPlate;
                    
                    // Simpan ke DB hanya jika pelat ini belum tersimpan sebelumnya
                    if (lastPlate !== lastSavedPlate) {
                        lastSavedPlate = lastPlate;
                        saveToMongoDB(id, colors, lastPlate);
                    }
                }
            } catch (err) {} finally {
                setTimeout(() => { isProcessingOCR = false; }, 2000); 
            }
        }

        async function boot() {
            ocrWorker = await Tesseract.createWorker('eng');
            model = await cocoSsd.load();
            await setupCamera();
            video.play();

            document.getElementById('dot').style.backgroundColor = "#00ff66";
            document.getElementById('dot').style.boxShadow = "0 0 8px #00ff66";
            runDetection();
        }

        boot();
    </script>
</body>
</html>
